<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRASS Auto კონტენტ გეგმა</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar and tabs; Overview and Report are single columns, the other tabs are a list beside an editable card. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --ink:#17231c; --muted:#5d6d63; --line:#d9e1dc;
  --accent:#1f5c3a; --accent-ink:#ffffff; --accent-soft:#e3efe8;
  --s-draft:#8a948e; --s-review:#b7791f; --s-fix:#c2413a; --s-ok:#2f855a;
  --font:'Noto Sans Georgian',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101612; --surface:#18211b; --ink:#e6eee9; --muted:#9baba1; --line:#2b372f;
    --accent:#5fb985; --accent-ink:#0d1a12; --accent-soft:#1f3328;
    --s-draft:#9aa59e; --s-review:#e0a53b; --s-fix:#ee7b72; --s-ok:#5fc38c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101612; --surface:#18211b; --ink:#e6eee9; --muted:#9baba1; --line:#2b372f;
  --accent:#5fb985; --accent-ink:#0d1a12; --accent-soft:#1f3328;
  --s-draft:#9aa59e; --s-review:#e0a53b; --s-fix:#ee7b72; --s-ok:#5fc38c;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:16px;margin:0}

.app{min-height:100%;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;background:var(--surface)}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-size:18px;font-weight:700;color:var(--accent)}
.brand span{font-size:12px;color:var(--muted)}
.month{display:flex;align-items:center;gap:6px;margin-left:auto}
.month button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:18px;line-height:1}
.month button:hover{background:var(--accent-soft)}
.month output{min-width:132px;text-align:center;font-weight:600}

.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.themebtn:hover{background:var(--accent-soft)}
:root[data-theme="light"]{color-scheme:light}
.tabs{display:flex;gap:2px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:5}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.tabs .n{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 7px;margin-left:5px}

.notice{margin:12px 20px 0;padding:10px 14px;border-radius:8px;background:var(--accent-soft);font-size:13px;display:none}
.notice.on{display:block}

.page{width:100%;max-width:980px;margin:0 auto;padding:16px 20px 32px;display:flex;flex-direction:column;gap:16px}
.lead{font-size:13px;color:var(--muted);margin:0}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column}
.tile b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:12.5px;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.attn{display:flex;flex-direction:column;gap:6px}
.attn button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;border-left:4px solid var(--c)}
.attn button:hover{border-color:var(--accent)}
.attn .ok{color:var(--muted);font-size:13.5px}

.phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column}
.phase.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.phase header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:6px}
.days{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 9px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.phase .who{font-size:12.5px;color:var(--muted)}
.phase .prog{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nowtag{font-size:11.5px;font-weight:700;color:var(--accent)}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.task input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.task .t{flex:1;min-width:0}
.task.done .t{color:var(--muted);text-decoration:line-through}
.task .by{display:block;font-size:11.5px;color:var(--muted);text-decoration:none}
.actor{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 7px;white-space:nowrap;margin-top:2px}
.ongoing li{margin:4px 0}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 20px 0}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.add:hover{filter:brightness(1.08)}
.add[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip b{font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.hintline{padding:8px 20px 0;font-size:12.5px;color:var(--muted)}

.main{flex:1;display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:16px;padding:14px 20px 28px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:11px 14px}
.row:hover{border-color:var(--accent)}
.row[aria-current="true"]{outline:2px solid var(--accent);outline-offset:-1px}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .name.empty{color:var(--muted);font-weight:400}
.row .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tag{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:500}
.emptybox{border:1px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.card .back{display:none;align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.f textarea{resize:vertical;min-height:84px}
.f textarea.tall{min-height:190px}
.f textarea.short{min-height:64px}
.f input:disabled,.f select:disabled,.f textarea:disabled{opacity:.7}
.f.key textarea,.f.key input{border-color:var(--accent)}
.f.key label{color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tp{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px}
.tp[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tp:disabled{opacity:.6;cursor:not-allowed}
.archive{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.archive button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13px}
.archive button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.prod{border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:8px}
.prod summary{padding:10px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.prod summary::-webkit-details-marker{display:none}
.prod summary::after{content:"▸";color:var(--muted);transition:transform .15s}
.prod[open] summary::after{transform:rotate(90deg)}
.prod .pbody{padding:0 14px 14px;display:grid;gap:10px}
.addsm{border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:8px;padding:8px 14px;font-weight:600}
.addsm:hover{background:var(--accent-soft)}
.addsm:disabled{opacity:.5;cursor:not-allowed}
body.locked .app{display:none}
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.logincard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.logincard h1{font-size:19px;margin:0;color:var(--accent)}
.logincard p{margin:0;color:var(--muted);font-size:13.5px}
.logincard label{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:4px}
.logincard input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.logincard .add{margin-top:10px}
.lerr{color:var(--s-fix)!important;min-height:1.2em}
.embedwrap{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.embed{width:100%;background:#000;border-radius:10px;overflow:hidden}
.embed.v{aspect-ratio:9/16;max-width:320px}
.embed.h{aspect-ratio:16/9;max-width:640px}
.embed iframe{width:100%;height:100%;border:0;display:block}
.embedbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.embedbar button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12.5px}
.embedbar button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.embedbar a{color:var(--accent)}
.statusrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.checks{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 10px}
.checks label{display:flex;gap:10px;align-items:center;font-weight:400;font-size:14px;color:var(--ink);padding:5px 0}
.checks input{width:17px;height:17px;accent-color:var(--accent);padding:0}
.checks .none{color:var(--muted);font-size:13px;padding:6px 0}

.status{display:flex;flex-wrap:wrap;gap:8px}
.status button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.status button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.status button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
.status button[aria-pressed="true"] i{background:#fff}
.status button[disabled]{opacity:.6;cursor:not-allowed}

.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.del{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 12px;color:var(--s-fix)}
.del.sure{background:var(--s-fix);border-color:var(--s-fix);color:#fff}
.placeholder{border:1px dashed var(--line);border-radius:12px;padding:48px 20px;text-align:center;color:var(--muted)}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

@media (max-width:860px){
  .main{grid-template-columns:1fr}
  .main.detail .list{display:none}
  .main:not(.detail) .detailcol{display:none}
  .card .back{display:block}
  .grid2{grid-template-columns:1fr}
  .month{margin-left:0}
}
@media (max-width:480px){.top,.main,.bar,.page,.hintline{padding-left:16px;padding-right:16px}.notice{margin-left:16px;margin-right:16px}}
@media (prefers-reduced-motion:no-preference){.row,.chip,.add,.tabs button{transition:border-color .15s,background .15s,color .15s}}
</style>
</head>
<body class="locked">
<div class="login" id="login" hidden>
  <form class="logincard" id="loginForm">
    <h1>GRASS Auto კონტენტ გეგმა</h1>
    <p>შესასვლელად გამოიყენეთ თქვენი ელფოსტა და პაროლი.</p>
    <label for="lemail">ელფოსტა</label><input id="lemail" type="email" autocomplete="username" required>
    <label for="lpass">პაროლი</label><input id="lpass" type="password" autocomplete="current-password" required>
    <button class="add" type="submit">შესვლა</button>
    <p class="lerr" id="lerr" role="alert"></p>
  </form>
</div>
<div class="app">
  <header class="top">
    <div class="brand"><b>GRASS Auto კონტენტ გეგმა</b><span>Alter Media × GRASS · საერთო სამუშაო სივრცე</span></div>
    <div class="month" role="group" aria-label="თვე">
      <button id="prev" type="button" aria-label="წინა თვე">‹</button>
      <output id="monthLabel"></output>
      <button id="next" type="button" aria-label="შემდეგი თვე">›</button>
    </div>
    <button class="themebtn" id="themeBtn" type="button"></button>
    <button class="themebtn" id="logoutBtn" type="button">გასვლა</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="განყოფილებები"></nav>
  <div class="notice" id="notice" role="status"></div>
  <div id="view"></div>
</div>

<script>
/* ---------- constants (wording follows the Grass Auto audit and the monthly workflow) ---------- */
const TYPES=["სწავლება","ვიზუალური დამტკიცება (Before/After)","მითების გაქარწყლება","ბათუმის კლიმატი","უსაფრთხოება","B2B","სანდოობა","სეგმენტის შიშზე პასუხი"];
const AUD=["B2B","B2C","B2B + B2C"];
const FEARS=["ავტომობილის დაზიანების შიში","ზარალი უხარისხო ან არასერტიფიცირებული პროდუქციისგან","ეჭვი ეფექტურობაში","გაზავების სირთულე და აღჭურვილობის არქონა","ჯანმრთელობა და სუნი","ყალბი, გაზავებული ან ვადაგასული პროდუქციის შიში ონლაინ ყიდვისას","B2B: მაღალი ხარჯი ერთ რეცხვაზე","B2B: არასტაბილური შედეგი და ცვალებადი კადრები","B2B: მიწოდების მოუწესრიგებლობა","ჩვევის ინერცია","აღქმითი გაერთიანება","შედეგის ხანმოკლეობის განცდა","არჩევანის სირთულე","უცნობი ბრენდი","B2B: გადასვლის რისკი"];
const ST_VIDEO=[{k:"draft",t:"მზადდება",c:"var(--s-draft)"},{k:"review",t:"არჩილის განხილვაში",c:"var(--s-review)"},{k:"fix",t:"საჭიროებს შესწორებას",c:"var(--s-fix)"},{k:"ok",t:"დამტკიცებულია",c:"var(--s-ok)"}];
const MONTHS=["იანვარი","თებერვალი","მარტი","აპრილი","მაისი","ივნისი","ივლისი","აგვისტო","სექტემბერი","ოქტომბერი","ნოემბერი","დეკემბერი"];
const A="არჩილი",AM="Alter Media",GA="GRASS + Alter Media";

const PHASES=[
 {id:"p1",from:1,to:3,days:"1–3",title:"ინფორმაციის შეგროვება და პროდუქტების შერჩევა",who:A,tasks:[
  ["a","ინფორმაციის მიწოდება: პროდუქტები, აქციები, კითხვები, სიახლეები, იდეები"],["b","მომდევნო თვის პროდუქტების შერჩევა და მათი დეტალების მიწოდება"]]},
 {id:"p2",from:4,to:7,days:"4–7",title:"კონტენტის დაგეგმვა და მომზადება",who:AM,tasks:[
  ["a","იდეები, სცენარები და გადაღების გეგმა"],["b","ყოველთვიური კონტენტ კალენდარი"]]},
 {id:"p3",from:8,to:10,days:"8–10",title:"კონტენტ კალენდრის შეთანხმება",who:GA,tasks:[
  ["a","კალენდრის გადახედვა, ტექნიკური დეტალების გადამოწმება, გადაღების დღეებსა და მსახიობზე შეთანხმება",A],["b","ცვლილებების გათვალისწინება და სცენარების საბოლოო ვერსია",AM]]},
 {id:"p4",from:11,to:24,days:"11–24",title:"გადაღება და კონტენტის წარმოება",who:AM,tasks:[

/* ---------- saving (debounced, one write at a time per document) ---------- */
function queueSave(col,id,patch){
  let it=D[col].find(x=>x.id===id);
  if(!it&&(col==="reports"||col==="infodocs")){it={id,month:id};D[col].push(it)}
  if(it)Object.assign(it,patch);
  const key=col+"/"+id;
  const s=saveState[key]||(saveState[key]={patch:{},timer:null,chain:Promise.resolve()});
  Object.assign(s.patch,patch);
  setSaveLabel("ინახება…");
  clearTimeout(s.timer);
  s.timer=setTimeout(()=>flush(col,id),("status" in patch)?0:700);
}
function flush(col,id){
  const s=saveState[col+"/"+id];if(!s||!db)return;
  const body=Object.assign({},s.patch,{updatedBy:uid||null,updatedAt:Date.now()});
  s.patch={};saving++;
  const ref=db.collection(col).doc(id);
  s.chain=s.chain.then(async()=>{
    if(col==="reports"||col==="infodocs"){const g=await ref.get();if(!g.exists)await ref.set({month:id,createdAt:Date.now()})}
    await ref.update(body);
  }).catch(e=>{
    notice("ცვლილება ვერ შეინახა"+(e&&e.code==="invalid_argument"?": თქვენ მხოლოდ ნახვის უფლება გაქვთ ან ჩანაწერი წაშლილია.":". სცადეთ ხელახლა."));
  }).then(()=>{saving--;if(!saving)setSaveLabel("შენახულია")});
}
function toggleTask(key){
  if(!db||!canWrite)return;
  const id=ym+"_"+key;
  const cur=D.checks.find(c=>c.id===id);
  const done=!(cur&&cur.done);
  const body={ym,key,done,by:uid||null,at:Date.now()};
  if(cur)Object.assign(cur,body);else D.checks.push(Object.assign({id},body));
  const s=saveState["checks/"+id]||(saveState["checks/"+id]={chain:Promise.resolve()});
  s.chain=s.chain.then(()=>db.collection("checks").doc(id).set(body)).catch(()=>notice("ამოცანის ნიშნულის შენახვა ვერ მოხერხდა."));
  render();
  const el=document.querySelector('[data-task="'+key+'"]');if(el)el.focus();
}

function embedUrl(u){
  u=(u||"").trim();if(!u)return"";
  let m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  if(m)return"https://drive.google.com/file/d/"+m[1]+"/preview";
  m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/))([\w-]{6,})/);
  if(m)return"https://www.youtube.com/embed/"+m[1];
  return"";
}
function patchEmbed(box,it){
  const wrap=box.querySelector('[data-wrap="_embed"]'),el=box.querySelector("#embedBox");if(!el)return;
  const raw=(it.driveUrl||"").trim(),url=embedUrl(raw);

  if(!url){el.dataset.src="";el.innerHTML='<span class="hint">ბმული ვერ ამოვიცანი. გამოიყენეთ Google Drive-ის ან YouTube-ის ბმული.</span>';return}
  if(el.dataset.src!==url){
    el.dataset.src=url;
    let mode="v";try{mode=localStorage.getItem("gp-embed")||"v"}catch(e){}
    el.innerHTML=`<div class="embed ${mode}"><iframe src="${esc(url)}" allow="autoplay; fullscreen" allowfullscreen loading="lazy" title="ვიდეო"></iframe></div>

function toRow(cfg,obj){const r={};for(const a in obj){const c=cfg.f[a];if(!c)continue;let v=obj[a];if(cfg.ts.includes(a)&&v!=null)v=new Date(v).toISOString();r[c]=v}return r}
function fromRow(cfg,row){const o={};for(const a in cfg.f){let v=row[cfg.f[a]];if(cfg.ts.includes(a)&&v)v=Date.parse(v);o[a]=v}return o}
function rowId(cfg,r){return cfg.kind==="id"?r.id:cfg.kind==="month"?r.month:r.month+"_"+r.task}
function idCond(cfg,id){return cfg.kind==="id"?{id}:cfg.kind==="month"?{month:id}:{month:id.split("_")[0],task:id.split("_").slice(1).join("_")}}
function withCond(q,cond){for(const k in cond)q=q.eq(k,cond[k]);return q}
async function ok(p){const r=await p;if(r.error)throw r.error;return r}

function makeDb(){
  return {collection(name){
    const cfg=MAPS[name],tbl=()=>sb.from(cfg.table);
    const conflict=cfg.kind==="month"?"month":"month,task";
    return {
      onSnapshot(next,error){
        let dead=false,timer=null;
        const load=async()=>{
          const r=await tbl().select("*");if(dead)return;
          if(r.error){error&&error(r.error);return}
          next({docs:r.data.map(row=>({id:rowId(cfg,row),data:()=>fromRow(cfg,row)})),metadata:{fromCache:false}});
        };
        load();
        const ch=sb.channel("rt-"+name+"-"+Math.random().toString(36).slice(2))
          .on("postgres_changes",{event:"*",schema:"public",table:cfg.table},()=>{clearTimeout(timer);timer=setTimeout(load,150)})
          .subscribe();
        return()=>{dead=true;sb.removeChannel(ch)};
      },
      doc(id){return{
        id,
        async get(){const r=await ok(withCond(tbl().select("*"),idCond(cfg,id)).maybeSingle());return{id,exists:!!r.data,data:()=>r.data?fromRow(cfg,r.data):undefined}},
        async set(body){await ok(tbl().upsert(Object.assign(cfg.kind==="check"?{}:idCond(cfg,id),toRow(cfg,body)),{onConflict:cfg.kind==="id"?"id":conflict}))},
        async update(body){
          const row=toRow(cfg,body);
          if(cfg.kind==="id")await ok(tbl().update(row).eq("id",id));
          else await ok(tbl().upsert(Object.assign(idCond(cfg,id),row),{onConflict:conflict}));
        },
        async delete(){await ok(withCond(tbl().delete(),idCond(cfg,id)))}
      }},
      async add(body){const r=await ok(tbl().insert(toRow(cfg,body)).select("id").single());return{id:r.data.id}}
    };
  }};
}
